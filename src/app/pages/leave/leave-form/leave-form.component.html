<mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Leave' : 'Create Leave' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>Reason</mat-label>
          <textarea matInput formControlName="reason" rows="2"></textarea>
          <mat-error *ngIf="leaveForm.get('reason')?.hasError('required')">
            Reason is required
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>Start Date</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate">
          <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
          <mat-error *ngIf="leaveForm.get('startDate')?.hasError('required')">
            Start date is required
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>End Date</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate">
          <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
          <mat-error *ngIf="leaveForm.get('endDate')?.hasError('required')">
            End date is required
          </mat-error>
        </mat-form-field>
  
        <div class="form-actions">
          <button mat-raised-button color="primary" type="submit" [disabled]="leaveForm.invalid">
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
          <button mat-raised-button type="button" [routerLink]="['/employees', employeeId, 'leaves']">
            Cancel
          </button>
        </div>
      </form>
    </mat-card-content>
</mat-card>
