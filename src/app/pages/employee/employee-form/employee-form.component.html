<mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Employee' : 'Create Employee' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline">
          <mat-label>First Name</mat-label>
          <input matInput formControlName="firstName">
          <mat-error *ngIf="employeeForm.get('firstName')?.hasError('required')">
            First name is required
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>Last Name</mat-label>
          <input matInput formControlName="lastName">
          <mat-error *ngIf="employeeForm.get('lastName')?.hasError('required')">
            Last name is required
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-error *ngIf="employeeForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="employeeForm.get('email')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="outline">
            <mat-label>Phone Number</mat-label>
            <input matInput formControlName="phone">
            <mat-error *ngIf="employeeForm.get('phone')?.hasError('required')">
              Phone number is required
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Address</mat-label>
            <textarea matInput formControlName="address" rows="2"></textarea>
            <mat-error *ngIf="employeeForm.get('address')?.hasError('required')">
                Address is required
            </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="outline">
          <mat-label>Gender</mat-label>
          <mat-select formControlName="gender">
            <mat-option value="male">Male</mat-option>
            <mat-option value="female">Female</mat-option>
          </mat-select>
          <mat-error *ngIf="employeeForm.get('gender')?.hasError('required')">
            Gender is required
          </mat-error>
        </mat-form-field>
  
        <div class="form-actions">
          <button 
            mat-raised-button 
            color="primary" 
            type="submit"
            [disabled]="employeeForm.invalid">
            {{ isEditMode ? 'Update' : 'Create' }}
          </button>
          <button 
            mat-raised-button 
            type="button" 
            [routerLink]="['/employee']"
            class="cancel-button">
            Cancel
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
