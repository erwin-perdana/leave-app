<div class="dashboard-container">
    <mat-card class="dashboard-card">
        <mat-card-header>
        <mat-card-title>Welcome to Admin Dashboard</mat-card-title>
        </mat-card-header>
        <mat-card-content>
        <p>Angular 19 + Material Dashboard</p>
        </mat-card-content>
    </mat-card>

    <div class="stats-grid">
        <mat-card *ngFor="let stat of stats" class="stat-card">
        <mat-card-header>
            <mat-card-title>{{ stat.title }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <h2>{{ stat.value }}</h2>
        </mat-card-content>
        </mat-card>
    </div>
</div>
